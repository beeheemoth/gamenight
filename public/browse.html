<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web proxy · Game Night</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  body { display:flex; flex-direction:column; height:100vh; }
  .bar { display:flex; align-items:center; gap:12px; padding:0 clamp(18px,4vw,48px) 14px; }
  .bar form { flex:1; display:flex; gap:10px; }
  .bar input { flex:1; min-width:0; padding:13px 20px; border-radius:999px; border:3px solid var(--edge); background:var(--panel); color:var(--ink); font:inherit; }
  .bar input::placeholder { color:var(--muted); }
  .bar button { padding:0 26px; border-radius:999px; border:3px solid var(--edge); background:var(--a1); color:var(--on-a1); font:800 16px var(--display); cursor:pointer; box-shadow:4px 4px 0 var(--edge); transition:transform .1s, box-shadow .1s; }
  .bar button:active { transform:translate(4px,4px); box-shadow:0 0 0 var(--edge); }
  .chip { font-size:14px; color:var(--muted); white-space:nowrap; display:flex; align-items:center; gap:8px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--a2); }
  .chip.ready .dot { background:var(--a1); }
  .chip.err { color:var(--a3); }
  .stage { position:relative; flex:1; margin:0 clamp(18px,4vw,48px) 22px; border:3px solid var(--edge); border-radius:20px; box-shadow:7px 7px 0 var(--edge); overflow:hidden; background:var(--panel); }
  .stage iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; }
  .hint { position:absolute; inset:0; display:grid; place-content:center; text-align:center; color:var(--muted); padding:24px; }
  .hint b { font:800 28px var(--display); color:var(--ink); display:block; margin-bottom:6px; }
  @media (max-width:640px) { .bar { flex-wrap:wrap; } .chip { order:3; width:100%; } }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/">Game Night</a>
  <nav><a href="/">Home</a><a href="/logout">Log out</a></nav>
</header>
<div class="bar">
  <form id="f">
    <input id="q" placeholder="Enter a website or search term" autocomplete="off" aria-label="Website or search term">
    <button>Go</button>
  </form>
  <div class="chip" id="chip"><span class="dot"></span><span id="status">Starting…</span></div>
</div>
<div class="stage">
  <div class="hint" id="hint"><div><b>Where to?</b>Type a site like wikipedia.org above.</div></div>
  <iframe id="frame" title="Proxied page"></iframe>
</div>

<script src="/uv/uv.bundle.js"></script>
<script src="/uv-config.js"></script>
<script type="module">
  import { BareMuxConnection } from "/baremux/index.mjs";
  const status = document.getElementById("status");
  const chip = document.getElementById("chip");
  const frame = document.getElementById("frame");
  const wisp = (location.protocol === "https:" ? "wss" : "ws") + "://" + location.host + "/wisp/";

  function toUrl(input) {
    input = input.trim();
    try { return new URL(input).toString(); } catch {}
    if (/^[^\s]+\.[^\s]{2,}$/.test(input)) return "https://" + input;
    return "https://duckduckgo.com/?q=" + encodeURIComponent(input);
  }

  async function init() {
    if (!("serviceWorker" in navigator)) throw new Error("Service workers aren't supported (use HTTPS or localhost).");
    await navigator.serviceWorker.register("/sw.js", { scope: __uv$config.prefix });
    const conn = new BareMuxConnection("/baremux/worker.js");
    await conn.setTransport("/epoxy/index.mjs", [{ wisp }]);
    status.textContent = "Ready"; chip.classList.add("ready");
  }
  const ready = init().catch(e => { status.textContent = "Error: " + e.message; chip.classList.add("err"); throw e; });

  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const value = document.getElementById("q").value;
    if (!value.trim()) return;
    await ready;
    document.getElementById("hint").hidden = true;
    frame.src = __uv$config.prefix + __uv$config.encodeUrl(toUrl(value));
  });
</script>
</body>
</html>
